<body>
<header class="top"><div class="wrap">
<a class="brand" href="#home">Sheet, Singil!</a>
<span id="sync" role="status"></span>
<nav id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>
<dialog id="dlg"><form id="dlgForm"><h2 id="dlgT"></h2><div id="dlgB"></div>
<div class="dfoot"><button type="button" class="btn" id="dlgNo">Cancel</button><button class="btn pri" id="dlgOk"></button></div></form></dialog>

<input type="file" id="rf" accept="application/json,.json" hidden>

<script>
/* ---------- Data layer: all Supabase code lives here ---------- */
const TABLES=['students','attendance','contributions','payments'];
const COL={attendance:{savedAt:'saved_at'},contributions:{appliesTo:'applies_to',studentIds:'student_ids'},payments:{contributionId:'contribution_id',studentId:'student_id'}};
const S={students:[],attendance:[],contributions:[],payments:[]};
const synced={};let sb=null,user=null,queue=Promise.resolve();
const toDb=(k,r)=>{const o={user_id:user.id};for(const f in r){const v=r[f];o[(COL[k]||{})[f]||f]=(f==='due'&&!v)?null:v}return o};
const fromDb=(k,r)=>{const rev=Object.fromEntries(Object.entries(COL[k]||{}).map(([a,b])=>[b,a])),o={};
  for(const f in r){if(f==='user_id'||f==='created_at')continue;o[rev[f]||f]=r[f]}
  if('amount' in o)o.amount=+o.amount;if('due' in o)o.due=o.due||'';return o};
let role=null,pending=0,failed=false,everSaved=false,needsReconcile=false,conflicts=[],recovering=false,pendingAcct=false;
const CAN={admin:{att:1,tre:1,stu:1,adm:1},officer:{att:1,tre:1}};
const NEED={students:'stu',attendance:'att',history:'att',treasurer:'tre',summary:'tre',contribution:'tre'};
const can=k=>!!(role&&CAN[role]&&CAN[role][k]);
const roster=()=>S.students.filter(s=>!s.inactive);
const ck=()=>'cm2_'+(user&&user.id);
const stable=o=>o&&typeof o==='object'?Array.isArray(o)?'['+o.map(stable)+']':'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}':JSON.stringify(o);
/* sig(): a stable fingerprint of a row, used to tell whether it changed */
const sig=r=>{const o={...r};delete o.savedAt;if(o.inactive===false)delete o.inactive;if(o.irregular===false)delete o.irregular;if('marks' in o){o.subject=o.subject||'';o.scope=o.scope||'all'}if('amount' in o&&'due' in o){if(!o.appliesTo||o.appliesTo==='class')o.appliesTo='all';if(!o.studentIds)o.studentIds=[]}if(typeof o.amount==='number')o.amount=Math.round(o.amount*100)/100;if('notes' in o&&o.notes==null)o.notes='';return stable(o)};
const NOTE={overwrote:'your offline edit replaced a newer change',kept:'kept a change made elsewhere instead of deleting it',dropped:'payment skipped because its student or contribution was deleted'};
const note=(table,action,row)=>({t:Date.now(),table,action,row});
function setSync(){const e=$('#sync');if(!e)return;
  e.innerHTML=!navigator.onLine?'Offline · saved on this device':failed?'<span style="color:var(--absent)">Not synced</span> <button data-act="retry">Retry</button>':pending?'Syncing…':needsReconcile?'Waiting to sync':everSaved?'Saved':''}
/* Every change is written to this device first, then sent to Supabase when possible. */
function persist(){if(!user)return;try{const sy={};TABLES.forEach(k=>sy[k]=[...(synced[k]||new Map())]);localStorage.setItem(ck(),JSON.stringify({S,sy,role,needs:needsReconcile,conf:conflicts}))}catch(e){}}
function readCache(){try{return JSON.parse(localStorage.getItem(ck()))}catch(e){return null}}
function applyCache(c){TABLES.forEach(k=>{S[k]=(c.S&&c.S[k])||[];synced[k]=new Map((c.sy&&c.sy[k])||[])});role='admin';needsReconcile=!!c.needs;conflicts=c.conf||[]}
function save(k){
  everSaved=true;persist();
  if(!navigator.onLine||needsReconcile||failed){needsReconcile=true;persist();setSync();if(navigator.onLine)syncSoon();return}
  pending++;setSync();
  queue=queue.then(async()=>{
    if(needsReconcile)return;
    const map=synced[k]||(synced[k]=new Map()),ids=new Set(S[k].map(r=>r.id));
    const del=[...map.keys()].filter(id=>!ids.has(id));
    for(let i=0;i<del.length;i+=50){const part=del.slice(i,i+50);const{error}=await sb.from(k).delete().in('id',part);if(error)throw error;part.forEach(id=>map.delete(id))}
    const up=S[k].filter(r=>map.get(r.id)!==sig(r));
    if(up.length){const{error}=await sb.from(k).upsert(up.map(r=>toDb(k,r)));if(error)throw error;up.forEach(r=>map.set(r.id,sig(r)))}
    persist();
  }).catch(e=>{needsReconcile=true;persist();console.error(e);toast('Saved on this device. It will sync when the connection works.');syncSoon()}).then(()=>{pending--;setSync()})}
let st;function syncSoon(){clearTimeout(st);st=setTimeout(()=>{queue=queue.then(runReconcile)},600)}
async function runReconcile(){
  if(!user||!role||!navigator.onLine||!needsReconcile)return;
  pending++;setSync();
  try{const changed=await reconcile();needsReconcile=false;failed=false;persist();if(changed||conflicts.length)render()}
  catch(e){failed=true;console.error(e)}
  pending--;setSync();
}
/* Three-way merge of: base (last synced copy), local (this device) and remote (Supabase).
   Rule: nothing is lost. An edit beats a delete; if both sides edited the same row, the local edit
   wins and the other version is recorded in "Sync notes". Rows are matched by id, so re-syncing never duplicates. */
async function reconcile(){
  const rem={};
  for(const k of TABLES){const{data,error}=await sb.from(k).select('*');if(error)throw error;rem[k]=new Map(data.map(x=>fromDb(k,x)).map(r=>[r.id,r]))}
  const byDate=new Map([...rem.attendance.values()].map(r=>[akey(r),r]));
  S.attendance=S.attendance.map(l=>{const r=byDate.get(akey(l));
    return r&&r.id!==l.id&&!rem.attendance.has(l.id)?{...r,marks:{...r.marks,...l.marks},names:{...r.names,...l.names}}:l});
  const out={},up={},del={};let changed=false;
  for(const k of TABLES){
    const base=synced[k]||new Map(),loc=new Map(S[k].map(r=>[r.id,r])),rm=rem[k],res=[];up[k]=[];del[k]=[];
    for(const id of new Set([...base.keys(),...loc.keys(),...rm.keys()])){
      const b=base.get(id),l=loc.get(id),m=rm.get(id),ls=l&&sig(l),ms=m&&sig(m);
      if(!l){
        if(!m)continue;
        if(b===undefined||ms!==b){res.push(m);changed=true;if(b!==undefined)conflicts.push(note(k,'kept',m))}
        else del[k].push(id);
        continue}
      if(b===undefined){res.push(l);if(!m||ms!==ls)up[k].push(l);continue}
      if(ls===b){
        if(!m){changed=true;continue}
        if(ms!==b){res.push(m);changed=true}else res.push(l);
        continue}
      res.push(l);
      if(!m||ms===b)up[k].push(l);
      else if(ms!==ls){up[k].push(l);conflicts.push(note(k,'overwrote',m))}
    }
    out[k]=res}
  const sid=new Set(out.students.map(x=>x.id)),cid=new Set(out.contributions.map(x=>x.id));
  const ok=p=>sid.has(p.studentId)&&cid.has(p.contributionId);
  out.payments.filter(p=>!ok(p)).forEach(p=>conflicts.push(note('payments','dropped',p)));
  out.payments=out.payments.filter(ok);up.payments=up.payments.filter(ok);
  for(const k of ['payments','attendance','contributions','students'])for(let i=0;i<del[k].length;i+=50){const{error}=await sb.from(k).delete().in('id',del[k].slice(i,i+50));if(error)throw error}
  for(const k of TABLES)if(up[k].length){const{error}=await sb.from(k).upsert(up[k].map(r=>toDb(k,r)));if(error)throw error}
  TABLES.forEach(k=>{S[k]=out[k];synced[k]=new Map(S[k].map(r=>[r.id,sig(r)]))});
  conflicts=conflicts.slice(-20);
  return changed;
}
async function loadAll(initial){
  const res=await Promise.all(TABLES.map(k=>sb.from(k).select('*')));
  if(!initial&&(pending||needsReconcile))return;
  res.forEach((r,i)=>{const k=TABLES[i];if(r.error)throw r.error;S[k]=r.data.map(x=>fromDb(k,x));synced[k]=new Map(S[k].map(x=>[x.id,sig(x)]))});
  needsReconcile=false;persist();
}
async function start(u,home){
  user=u;role='admin';
  try{localStorage.setItem('cm2_last',JSON.stringify({id:u.id,email:u.email,section:(u.user_metadata&&u.user_metadata.section_name)||u.section||''}))}catch(e){}
  const cached=readCache();let used=false;
  try{
    if(!navigator.onLine)throw new Error('offline');
    {
      if(cached&&cached.needs){const r=role;applyCache(cached);used=true;role=r;await reconcile();needsReconcile=false;failed=false;persist()}
      else await loadAll(true);
    }
  }catch(e){
    if(cached){if(!used)applyCache(cached);failed=navigator.onLine;toast(navigator.onLine?'Could not reach the server. Using data saved on this device.':'Offline mode: using the data saved on this device.')}
    else toast(navigator.onLine?'Could not load data: '+e.message:'You are offline. Connect to the internet once to load your data.')
  }
  loadDraft();if(home)location.hash='home';render();
}
/* Pull other devices' changes when the tab is reopened or every minute (never while saving or typing). */
async function refresh(){
  if(!user||!role||!navigator.onLine)return;
  if(needsReconcile&&!pending){syncSoon();return}
  if(pending||failed||document.querySelector('dialog[open]'))return;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  try{await loadAll();render()}catch(e){}
}
async function doSignOut(){
  const key=user&&ck();
  try{await Promise.race([sb.auth.signOut({scope:'local'}),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)||k==='cm2_last'||k===key).forEach(k=>localStorage.removeItem(k));
  user=null;role=null;needsReconcile=false;failed=false;conflicts=[];TABLES.forEach(k=>{S[k]=[];synced[k]=new Map()});
  ui.auth='in';ui.authMsg='';history.replaceState(null,'',location.pathname);render();
}
async function boot(){
  const c=window.SINGIL_CONFIG||{};
  if(!c.url||c.url.includes('YOUR_')){$('#app').innerHTML='<div class="card"><h2>Connect Supabase</h2><p class="sub">Open config.js and add your Supabase project URL and anon key.</p></div>';return}
  recovering=/type=recovery/.test(location.hash+location.search);
  const herr=new URLSearchParams(location.hash.slice(1)).get('error_description');
  if(herr){ui.authMsg=herr;ui.auth='forgot';history.replaceState(null,'',location.pathname)}
  let base=c.url.trim();try{base=new URL(base).origin}catch(e){}
  sb=supabase.createClient(base,c.anonKey.trim());
  sb.auth.onAuthStateChange(ev=>{
    if(ev==='PASSWORD_RECOVERY'){recovering=true;render()}
    if(ev==='SIGNED_OUT'&&user){user=null;role=null;render()}
  });
  let session=null;try{const{data}=await sb.auth.getSession();session=data.session}catch(e){}
  if(recovering&&!session){recovering=false;ui.auth='forgot';ui.authMsg='This reset link is invalid or has expired. Request a new one.'}
  if(session&&!recovering)start(session.user);
  else if(!session&&!navigator.onLine){const lu=JSON.parse(localStorage.getItem('cm2_last')||'null');lu?start(lu):render()}
  else render();
}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID();
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

function payInfo(c,sid){
  const list=S.payments.filter(p=>p.contributionId===c.id&&p.studentId===sid).sort((a,b)=>a.date.localeCompare(b.date));
  const paid=list.reduce((t,p)=>t+p.amount,0),bal=Math.max(0,c.amount-paid);
  return{list,paid,bal,status:paid>=c.amount?'Paid':paid>0?'Partial':'Unpaid'};
}
function applies(c,s){const a=c.appliesTo||'all';return a==='person'?(c.studentIds||[]).includes(s.id):a==='regular'?!s.irregular:a==='irregular'?!!s.irregular:true}
const target=c=>roster().filter(s=>applies(c,s));
const aLabel=c=>{const a=c.appliesTo;return a==='person'?'Selected students ('+(c.studentIds||[]).length+')':a==='regular'?'Regular students':a==='irregular'?'Irregular students':'All students'};
const akey=a=>a.date+'|'+(a.subject||'').trim().toLowerCase();
const scopeLabel=x=>x==='regular'?'Regular students':x==='irregular'?'Irregular students':'All students';
const sessPool=()=>roster().filter(s=>ui.scope==='regular'?!s.irregular:ui.scope==='irregular'?!!s.irregular:true);
function cStats(c){
  const r={collected:S.payments.filter(p=>p.contributionId===c.id).reduce((t,p)=>t+p.amount,0),Paid:0,Partial:0,Unpaid:0,expected:c.amount*target(c).length};
  target(c).forEach(s=>{r[payInfo(c,s.id).status]++});
  return r;
}
function attCounts(marks,ids){const r={Present:0,Absent:0,Late:0,Excused:0,Unmarked:0};ids.forEach(id=>r[marks[id]||'Unmarked']++);return r}

function parseNames(txt){

    const k=n.toLowerCase();if(seen.has(k))dups.push(n);else{seen.add(k);fresh.push(n)}});

  },
  printAtt({id}){const a=attRec(id);if(!Object.keys(a.names).length)return toast('No students to print');const d=attData(a);
    printDoc(`<h1>${esc(d.title)}</h1><p>${esc(d.sub[0])}</p><table class="sum"><tr>${Object.entries(d.counts).filter(([k,v])=>k!=='Unmarked'||v).map(([k,v])=>`<td>${k}<b>${v}</b></td>`).join('')}</tr></table><table><thead><tr><th>#</th><th>Student</th><th>Type</th><th>Status</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>`)},
  pdfAtt({id}){const a=attRec(id);if(!Object.keys(a.names).length)return toast('No students to export');const d=attData(a);
    pdfFile('attendance-'+fileSafe(a.subject||'general')+'-'+a.date+'.pdf',{title:d.title,sub:d.sub,stats:Object.entries(d.counts).filter(([k,v])=>k!=='Unmarked'||v),sections:[{head:['#','Student','Type','Status'],body:d.rows,cols:{0:{cellWidth:12}}}]})},
  toggleIrr({id}){const s=S.students.find(x=>x.id===id);s.irregular=!s.irregular;save('students');toast(s.name+' is now '+(s.irregular?'irregular':'regular'));render()},
  pdfSummary(){const{tot,groups,q}=sumCalc();if(!groups.length)return toast('Nothing to export');
    const fc=ui.fc==='all'?'All contributions':(S.contributions.find(c=>c.id===ui.fc)||{}).name,fs=ui.fs==='all'?'All statuses':ui.fs==='Partial'?'Partially paid':ui.fs;
    pdfFile('payment-summary-'+today()+'.pdf',{title:'Full payment summary',sub:[[sec(),ABOUT.site,'Printed '+fmt(today())].filter(Boolean).join(' · '),'Filter: '+fc+' · '+fs+(q?' · Search "'+ui.q.trim()+'"':'')],
      stats:[['Total collected',pp(tot.coll)],['Outstanding',pp(tot.out)],['Paid',tot.Paid],['Partially paid',tot.Partial],['Unpaid',tot.Unpaid]],
      sections:groups.map(g=>({heading:g.c.name,note:`${pp(g.c.amount)} per student · ${aLabel(g.c)} · Due ${fmt(g.c.due)} · Collected ${pp(g.t.collected)} of ${pp(g.t.expected)}`,head:['Student','Required','Paid','Balance','Status'],body:g.rows.map(r=>[r.s.name+(r.s.irregular?' (irregular)':''),pp(g.c.amount),pp(r.i.paid),pp(r.i.bal),r.i.status==='Partial'?'Partially paid':r.i.status]),cols:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}}}))})},
  pdfC({id}){const c=S.contributions.find(x=>x.id===id),t=cStats(c),rows=target(c).sort(byName).map(s=>({s,i:payInfo(c,s.id)}));
    pdfFile('contribution-'+fileSafe(c.name)+'-'+today()+'.pdf',{title:c.name+' - Payment records',sub:[[sec(),aLabel(c),'Due '+fmt(c.due),'Printed '+fmt(today())].filter(Boolean).join(' · ')].concat(c.notes?[c.notes]:[]),
      stats:[['Per student',pp(c.amount)],['Collected',pp(t.collected)],['Expected',pp(t.expected)],['Paid',t.Paid],['Partially paid',t.Partial],['Unpaid',t.Unpaid]],
      sections:[{head:['#','Student','Required','Paid','Balance','Status'],body:rows.map((r,n)=>[n+1,r.s.name+(r.s.irregular?' (irregular)':''),pp(c.amount),pp(r.i.paid),pp(r.i.bal),r.i.status==='Partial'?'Partially paid':r.i.status]),cols:{0:{cellWidth:10},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}}]})},
  toggle({id}){ui.open[id]=!ui.open[id];render()},
  editRec({id}){const a=S.attendance.find(x=>x.id===id);ui.date=a.date;ui.subject=a.subject||'';ui.scope=a.scope||'all';ui.marks={...a.marks};ui.keep=true;location.hash='attendance'},
  delRec({id}){confirmBox('Delete record?','This attendance record will be permanently removed.','Delete',()=>{S.attendance=S.attendance.filter(a=>a.id!==id);save('attendance')})},
  editStudent({id}){const s=S.students.find(x=>x.id===id);modal('Edit student',nameForm(s.name),'Save changes',f=>{const n=f.get('name').trim();if(!n)return false;if(S.students.some(x=>x.id!==id&&x.name.toLowerCase()===n.toLowerCase())){toast('That name is already in the list');return false}s.name=n;save('students');toast('Student updated')})},
  delStudent({id}){const s=S.students.find(x=>x.id===id);confirmBox('Remove student?',`${esc(s.name)} and all their payments will be permanently deleted. Archiving keeps the records. Past attendance records keep the name.`,'Remove',()=>{S.students=S.students.filter(x=>x.id!==id);S.payments=S.payments.filter(p=>p.studentId!==id);delete ui.marks[id];save('students');save('payments')})},
  newC(){modal('New contribution',cForm(),'Create contribution',f=>{
    const v=cRead(f);if(!v)return false;const c={id:uid(),...v,created:today()};
    S.contributions.push(c);save('contributions');toast('Contribution created');location.hash='c/'+c.id;return true})},
  editC({id}){const c=S.contributions.find(x=>x.id===id);modal('Edit contribution',cForm(c),'Save changes',f=>{const v=cRead(f);if(!v)return false;Object.assign(c,v);save('contributions');toast('Contribution updated')})},
  delC({id}){confirmBox('Delete contribution?','All payments recorded for it will also be deleted.','Delete',()=>{S.contributions=S.contributions.filter(c=>c.id!==id);S.payments=S.payments.filter(p=>p.contributionId!==id);save('contributions');save('payments');location.hash='treasurer'})},
  pay({c,id}){const con=S.contributions.find(x=>x.id===c),s=S.students.find(x=>x.id===id),i=payInfo(con,id);
    modal('Payment · '+s.name,`<p class="meta" style="color:var(--mute)">Balance: ${peso(i.bal)}</p>`+dateAmt(i.bal||'',today()),'Save payment',f=>{
      const amount=parseFloat(f.get('amount'));if(!(amount>0))return false;
      S.payments.push({id:uid(),contributionId:c,studentId:id,amount,date:f.get('date')});save('payments');toast(isDone(con)?'Payment recorded. This contribution is now complete!':'Payment recorded')})},
  editPay({id}){const p=S.payments.find(x=>x.id===id);modal('Edit payment',dateAmt(p.amount,p.date),'Save changes',f=>{
    const amount=parseFloat(f.get('amount'));if(!(amount>0))return false;p.amount=amount;p.date=f.get('date');save('payments');toast('Payment updated')})},
  delPay({id}){confirmBox('Delete payment?','This payment will be removed from the history.','Delete',()=>{S.payments=S.payments.filter(p=>p.id!==id);save('payments')})}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)acts[b.dataset.act](b.dataset)});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;render()}
  if(e.target.id==='bt')bulkPreview(e.target.value);
  if(e.target.id==='ap')$('#pp').hidden=e.target.value!=='person';
  if(e.target.id==='sj')ui.subject=e.target.value;
  if(e.target.id==='sc'){ui.scope=e.target.value;render()}
  if(e.target.id==='fc'){ui.fc=e.target.value;render()}
  if(e.target.id==='fs'){ui.fs=e.target.value;render()}
  if(e.target.id==='dt'&&e.target.value){ui.date=e.target.value;loadDraft();render()}
});
document.addEventListener('submit',e=>{
  const fm=e.target.dataset.form;if(['in','up','forgot','reset'].includes(fm)){e.preventDefault();acts['do_'+fm]()}
  if(e.target.dataset.form==='addStudent'){e.preventDefault();const n=e.target.name.value.trim();
    if(n){if(S.students.some(x=>x.name.toLowerCase()===n.toLowerCase()))return toast('Already in the list: '+n);S.students.push({id:uid(),name:n,irregular:!!e.target.irr.checked});save('students');toast('Student added');render();$('[name=name]').focus()}}
});
function restoreData(d){
  const sid=new Set(d.students.map(x=>x.id)),cid=new Set(d.contributions.map(x=>x.id));
  S.students=d.students;S.contributions=d.contributions;S.attendance=d.attendance;
  S.payments=d.payments.filter(p=>sid.has(p.studentId)&&cid.has(p.contributionId));
  ['students','contributions','payments','attendance'].forEach(save);ui.marks={};loadDraft();toast('Backup restored');
}
$('#rf').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!['students','attendance','contributions','payments'].every(k=>Array.isArray(d[k])))throw 0;
    modal('Restore backup?',`<p style="margin:0 0 10px">Backup from <b>${esc(d.exported||'unknown date')}</b>: ${d.students.length} students, ${d.attendance.length} attendance records, ${d.contributions.length} contributions, ${d.payments.length} payments.</p><p style="margin:0"><b>This replaces all current data.</b> Download a backup of your current data first if you may need it.</p>`,'Restore',()=>restoreData(d));
  }catch(err){toast('That file is not a valid backup')}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(refresh,60000);
window.addEventListener('online',()=>{setSync();if(user&&role){if(needsReconcile||failed)acts.retry();else refresh()}});
window.addEventListener('offline',setSync);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.addEventListener('beforeunload',e=>{if(pending){e.preventDefault();e.returnValue=''}});
boot();
</script>
</body>
</html>
